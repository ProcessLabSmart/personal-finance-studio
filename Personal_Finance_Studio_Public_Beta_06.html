<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Finance Studio — Public Beta</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#193044;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:22px}header{background:#fff;border-bottom:1px solid #dbe5eb}.head{max-width:1100px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 14px}p{line-height:1.5}.motto{font-size:13px;color:#527080;margin-top:6px}.tag{display:inline-block;background:#e2f3ef;color:#186b60;border-radius:30px;padding:5px 10px;font-size:12px;font-weight:bold}button,select,input{font:inherit;border-radius:7px;border:1px solid #cbd9e0;padding:9px}button{cursor:pointer;background:#155e75;color:white;border:0}button.secondary{background:#e8eff3;color:#234}button.danger{background:#fbe8e8;color:#963d3d}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #0a89a5;outline-offset:2px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.card{background:white;border-radius:13px;padding:20px;margin:17px 0;box-shadow:0 1px 5px #dce4ea}.intro{color:#557080;font-size:14px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:#fff;padding:18px;border-radius:12px;box-shadow:0 1px 5px #dce4ea}.metric .label{color:#567080;font-size:13px}.metric strong{display:block;font-size:24px;margin-top:9px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.controls label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#486274}.controls input{width:115px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5ebef}th{background:#eff5f7}td input{width:100%;min-width:95px}td:nth-child(2){width:180px}td:last-child{width:80px}.right{text-align:right}.hint{color:#607789;font-size:13px}.footer{text-align:center;color:#70818a;font-size:12px;padding:15px}.lang{display:flex;gap:5px}.lang button{padding:8px 12px}.lang button[aria-pressed=false]{background:#e9f0f3;color:#28495a}@media(max-width:600px){main{padding:12px}.head{padding:14px}.card{padding:14px}h1{font-size:21px}}

/* Visual hierarchy: controls and monthly KPI panel, independent of data logic. */
main > .toolbar{background:#e6f1f7;border:1px solid #c8dfe9;border-left:5px solid #155e75;border-radius:13px;padding:14px 16px;margin:14px 0 20px;box-shadow:0 2px 7px #d8e5ed}
main > .toolbar label{color:#244c61;font-weight:700}
main > h2[data-i="currentTitle"]{background:#dcefeb;color:#15584f;border-radius:12px 12px 0 0;padding:15px 18px;margin:23px 0 0!important;border:1px solid #b8dcd2;border-bottom:0}
#summary{background:#eaf6f2;border:1px solid #b8dcd2;border-top:0;border-radius:0 0 12px 12px;padding:15px;gap:12px}
#summary .metric{background:#fff;border:1px solid #d4e8e1;box-shadow:0 2px 5px #c7ded6}
#summary .metric strong{color:#15584f}
#summary .metric:nth-child(1){border-top:4px solid #2476a5}
#summary .metric:nth-child(2){border-top:4px solid #dc9250}
#summary .metric:nth-child(3){border-top:4px solid #6596a4}
#summary .metric:nth-child(4){border-top:4px solid #27997f}
#summary .metric:nth-child(5){border-top:4px solid #4878b8}
#summary .metric:nth-child(6){border-top:4px solid #b7875e}
#summary .metric:nth-child(7){border-top:4px solid #278b75}
@media(max-width:600px){main > .toolbar{padding:12px}#summary{padding:11px}}

/* Selected-period dashboard: distinct violet/blue panel and prominent range controls. */
#periodCard{background:#edf0fc;border:1px solid #cbd4f0;border-left:5px solid #5d6bb0;box-shadow:0 3px 9px #d9def0}
#periodCard h2{color:#354580;font-size:19px}
#periodCard .controls{background:#dfe6fa;border:1px solid #c6d3f3;border-radius:10px;padding:12px 14px;width:fit-content;max-width:100%}
#periodCard .controls label{color:#344c85;font-weight:700}
#periodCard .controls input[type=month]{background:#fff;border:2px solid #9caee0;color:#263b72;width:150px;min-height:41px;font-weight:600}
#periodCard #periodSummary .metric{background:#fff;border:1px solid #d5dcf3;border-top:4px solid #687bb9;box-shadow:0 2px 5px #d7ddf1}
#periodCard #periodSummary .metric strong{color:#354580}
#periodCard .hint{color:#50608c}
@media(max-width:600px){#periodCard .controls{width:100%}#periodCard .controls input[type=month]{width:140px}}
</style></head><body><header><div class="head"><div><h1>Personal Finance Studio <span class="tag">PUBLIC BETA 0.6</span></h1><div class="motto">Change with purpose. Improve with impact.</div></div><div class="lang"><button id="ro" aria-pressed="true">RO</button><button id="en" aria-pressed="false">EN</button></div></div></header><main>
<p class="intro" data-i="intro"></p><div class="toolbar"><label><span data-i="month"></span> <input id="month" type="month"></label><label><span data-i="currency"></span> <select id="currency"><option>RON</option><option>EUR</option><option>USD</option><option>GBP</option></select></label><button id="addMonth" data-i="addMonth"></button><button id="export" class="secondary" data-i="export"></button><button id="import" class="secondary" data-i="import"></button><input type="file" id="file" accept=".json,application/json" hidden></div>
<section class="card" id="periodCard"><h2 data-i="periodTitle"></h2><div class="controls"><label><span data-i="from"></span><input type="month" id="from"></label><label><span data-i="to"></span><input type="month" id="to"></label></div><div class="summary" id="periodSummary" style="margin-top:14px"></div><p class="hint" data-i="periodHint"></p></section><section class="card"><h2 data-i="openingTitle"></h2><div class="controls"><label><span data-i="opening"></span><input id="openingSavings" type="number" min="0" step="0.01" style="width:190px"></label></div><p class="hint" data-i="openingHint"></p></section><h2 data-i="currentTitle" style="margin:22px 0 12px"></h2><div class="summary" id="summary"></div><div id="sections"></div>
<section class="card"><h2 data-i="infoTitle"></h2><p class="hint" data-i="info"></p></section><div class="footer">Personal Finance Studio · Public Beta 0.6 · Change with purpose. Improve with impact.</div></main>
<script>
(()=>{'use strict';
// Separate namespace: never reads or writes the personal application's keys.
const KEY='pfs-public-beta03-budget', OLD_KEY='pfs-public-beta01-budget', LANG_KEY='pfs-public-beta01-language';
const t={ro:{intro:'Versiune publică de test, complet separată de aplicația personală. Începe cu valori zero. Datele rămân în acest browser.',month:'Luna',currency:'Monedă',addMonth:'+ Luna următoare',export:'Export JSON',import:'Import JSON',income:'Venituri',expenses:'Cheltuieli',savings:'Economii planificate',balance:'Rest disponibil',withdrawals:'Retrageri din economii',periodTitle:'Totaluri pe perioada selectată',currentTitle:'Total luna curentă',openingTitle:'Sold inițial economii',opening:'Economii existente la începutul evidenței',openingHint:'Soldul inițial se adaugă economiilor și se diminuează cu retragerile. Nu afectează veniturile, cheltuielile sau restul disponibil.',savingsBalance:'Sold economii acumulat',from:'De la',to:'Până la',periodHint:'Se însumează numai lunile existente în buget, inclusiv capetele intervalului. Retragerile sunt raportate separat: nu sunt cheltuieli și nu modifică restul disponibil.',currencyWarning:'Schimbarea monedei schimbă doar unitatea afișată, fără conversia sumelor existente. Continui?',before:'Rest înainte de economii',addRow:'+ Adaugă categorie',name:'Categorie',amount:'Sumă',remove:'Șterge',empty:'Categorie nouă',infoTitle:'Confidențialitate și siguranță',info:'Datele sunt salvate doar în acest browser, pe acest dispozitiv. Nu există cont, sincronizare sau stocare pe server. Exportă periodic fișierul JSON: ștergerea datelor browserului poate elimina bugetul. Nu introduce parole sau date bancare sensibile.',confirm:'Ștergi această categorie?',badFile:'Fișier JSON invalid sau incompatibil.',importConfirm:'Importul va înlocui datele Public Beta de pe acest dispozitiv. Continui?',duplicate:'Luna există deja.',noMonths:'Adaugă o lună.',total:'Total',note:'Valori demonstrative: niciuna. Introdu propriile categorii și sume.'},en:{intro:'Public test edition, completely separate from the personal application. Starts with zero values. Data stays in this browser.',month:'Month',currency:'Currency',addMonth:'+ Next month',export:'Export JSON',import:'Import JSON',income:'Income',expenses:'Expenses',savings:'Planned savings',balance:'Available balance',withdrawals:'Savings withdrawals',periodTitle:'Totals for selected period',currentTitle:'Current month totals',openingTitle:'Opening savings balance',opening:'Savings held at the start of tracking',openingHint:'Opening balance increases savings holdings; withdrawals reduce them. Neither changes income, expenses or available balance.',savingsBalance:'Accumulated savings balance',from:'From',to:'Through',periodHint:'Only months already in the budget are included, inclusive of both dates. Withdrawals are shown separately: they are not expenses and do not affect the available balance.',currencyWarning:'Changing currency changes only the displayed unit; existing amounts are not converted. Continue?',before:'Before savings',addRow:'+ Add category',name:'Category',amount:'Amount',remove:'Delete',empty:'New category',infoTitle:'Privacy and safety',info:'Data is stored only in this browser on this device. No account, synchronization, or server storage. Export a JSON backup regularly: clearing browser data may delete your budget. Do not enter passwords or sensitive bank details.',confirm:'Delete this category?',badFile:'Invalid or incompatible JSON file.',importConfirm:'Import will replace this device’s Public Beta data. Continue?',duplicate:'This month already exists.',noMonths:'Add a month.',total:'Total',note:'Sample financial figures: none. Enter your own categories and amounts.'}};
const validSections=['income','expenses','savings','withdrawals'];const fresh=()=>({version:2,currency:'RON',openingSavings:0,months:{}});
let data=fresh();try{const x=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY));if(x&&(x.version===1||x.version===2)&&x.months&&typeof x.months==='object'){data={version:2,currency:x.currency||'RON',openingSavings:Number(x.openingSavings)||0,months:x.months};for(const m of Object.values(data.months))if(!Array.isArray(m.withdrawals))m.withdrawals=[];}}catch(e){}
let lang=localStorage.getItem(LANG_KEY)==='en'?'en':'ro';let current=new Date().toISOString().slice(0,7);let from='',to='';
// Reuse category names from the closest previous populated month, never its amounts.
// Existing month amounts and categories are not overwritten.
function monthObj(m){
 if(!data.months[m])data.months[m]={income:[],expenses:[],savings:[],withdrawals:[]};
 const target=data.months[m];
 for(const key of validSections){
  if(!Array.isArray(target[key]))target[key]=[];
  if(target[key].length)continue;
  const sources=Object.keys(data.months).filter(k=>k!==m && k<m && Array.isArray(data.months[k][key]) && data.months[k][key].some(r=>r.name.trim())).sort().reverse();
  if(sources.length)target[key]=data.months[sources[0]][key].filter(r=>r.name.trim()).map(r=>({name:r.name,amount:0}));
 }
 return target;
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function money(n){return new Intl.NumberFormat(lang==='ro'?'ro-RO':'en-US',{maximumFractionDigits:2}).format(n||0)+' '+data.currency}
function total(rows){return rows.reduce((a,r)=>a+(Number(r.amount)||0),0)}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[lang][e.dataset.i]);for(const l of ['ro','en'])document.getElementById(l).setAttribute('aria-pressed',String(lang===l));document.getElementById('month').value=current;document.getElementById('currency').value=data.currency;document.getElementById('openingSavings').value=data.openingSavings||0;
const rows=monthObj(current);save();const a=total(rows.income),b=total(rows.expenses),c=total(rows.savings),w=total(rows.withdrawals);const metrics=[['income',a],['expenses',b],['before',a-b],['savings',c],['balance',a-b-c],['withdrawals',w],['savingsBalance',savingsThrough(current)]];const summary=document.getElementById('summary');summary.replaceChildren();for(const [key,v] of metrics){const card=el('article','metric');card.append(el('span','label',t[lang][key]),el('strong','',money(v)));summary.append(card)}
updatePeriod();const sections=document.getElementById('sections');sections.replaceChildren();for(const key of validSections){const card=el('section','card');const h=el('h2','',t[lang][key]);const scroll=el('div','scroll');const table=el('table');const thead=el('thead');const hr=el('tr');for(const title of [t[lang].name,t[lang].amount,''])hr.append(el('th','',title));thead.append(hr);table.append(thead);const body=el('tbody');rows[key].forEach((r,index)=>{const tr=el('tr');const tdName=el('td');const name=el('input');name.value=r.name;name.placeholder=t[lang].empty;name.addEventListener('input',()=>{r.name=name.value;save()});tdName.append(name);const tdAmount=el('td');const amount=el('input');amount.type='number';amount.min='0';amount.step='0.01';amount.value=r.amount;amount.addEventListener('input',()=>{r.amount=Math.max(0,Number(amount.value)||0);save();updateSummary()});tdAmount.append(amount);const tdRemove=el('td');const del=el('button','danger',t[lang].remove);del.addEventListener('click',()=>{if(confirm(t[lang].confirm)){rows[key].splice(index,1);save();render()}});tdRemove.append(del);tr.append(tdName,tdAmount,tdRemove);body.append(tr)});table.append(body);scroll.append(table);const bar=el('div','toolbar');bar.style.marginTop='12px';const add=el('button','secondary',t[lang].addRow);add.addEventListener('click',()=>{rows[key].push({name:'',amount:0});save();render()});bar.append(add);card.append(h,scroll,bar);sections.append(card)}}
function savingsThrough(end){let n=Number(data.openingSavings)||0;for(const k of Object.keys(data.months)){if(k>end)continue;const r=data.months[k];n+=total(r.savings||[])-total(r.withdrawals||[])}return n}
function updatePeriod(){const keys=Object.keys(data.months).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort();if(!from)from=keys[0]||current;if(!to)to=keys[keys.length-1]||current;document.getElementById('from').value=from;document.getElementById('to').value=to;const sums={income:0,expenses:0,savings:0,withdrawals:0};for(const k of keys){if(k<from||k>to)continue;const r=data.months[k];for(const section of validSections)sums[section]+=total(r[section]||[])}const vals=[['income',sums.income],['expenses',sums.expenses],['savings',sums.savings],['balance',sums.income-sums.expenses-sums.savings],['withdrawals',sums.withdrawals],['savingsBalance',savingsThrough(to)]];const wrap=document.getElementById('periodSummary');wrap.replaceChildren();for(const [key,value] of vals){const card=el('article','metric');card.append(el('span','label',t[lang][key]),el('strong','',money(value)));wrap.append(card)}}
function updateSummary(){const r=monthObj(current),a=total(r.income),b=total(r.expenses),c=total(r.savings),w=total(r.withdrawals);const vals=[a,b,a-b,c,a-b-c,w,savingsThrough(current)];document.querySelectorAll('#summary .metric strong').forEach((e,i)=>e.textContent=money(vals[i]));updatePeriod()}
document.getElementById('openingSavings').addEventListener('input',e=>{data.openingSavings=Math.max(0,Number(e.target.value)||0);save();updateSummary()});
for(const l of ['ro','en'])document.getElementById(l).addEventListener('click',()=>{lang=l;localStorage.setItem(LANG_KEY,l);render()});document.getElementById('month').addEventListener('change',e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){current=e.target.value;render();save()}});document.getElementById('currency').addEventListener('change',e=>{if(!confirm(t[lang].currencyWarning)){e.target.value=data.currency;return}data.currency=e.target.value;save();render()});for(const id of ['from','to'])document.getElementById(id).addEventListener('change',e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){if(id==='from')from=e.target.value;else to=e.target.value;updatePeriod()}});document.getElementById('addMonth').addEventListener('click',()=>{let [y,m]=current.split('-').map(Number);m++;if(m===13){m=1;y++}current=y+'-'+String(m).padStart(2,'0');monthObj(current);save();render()});document.getElementById('export').addEventListener('click',()=>{save();const blob=new Blob([JSON.stringify({app:'Personal Finance Studio Public Beta',...data},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='PFS_Public_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});document.getElementById('import').addEventListener('click',()=>document.getElementById('file').click());document.getElementById('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x.app!=='Personal Finance Studio Public Beta'||![1,2].includes(x.version)||!x.months||typeof x.months!=='object'||!['RON','EUR','USD','GBP'].includes(x.currency)||(x.openingSavings!==undefined&&(!Number.isFinite(Number(x.openingSavings))||Number(x.openingSavings)<0))||Object.values(x.months).some(m=>!m||['income','expenses','savings'].some(k=>!Array.isArray(m[k])||m[k].some(r=>typeof r.name!=='string'||!Number.isFinite(Number(r.amount))))||(m.withdrawals!==undefined&&(!Array.isArray(m.withdrawals)||m.withdrawals.some(r=>typeof r.name!=='string'||!Number.isFinite(Number(r.amount)))))))throw Error('Invalid');if(confirm(t[lang].importConfirm)){data={version:2,currency:x.currency,openingSavings:Math.max(0,Number(x.openingSavings)||0),months:x.months};for(const m of Object.values(data.months))if(!Array.isArray(m.withdrawals))m.withdrawals=[];from='';to='';save();render()}}catch(err){alert(t[lang].badFile)}e.target.value=''});render();
})();
</script></body></html>
